[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chittam"
version = "0.1.0"
description = "Chittam — Local-first multimodal semantic memory, temporal decision graph, and canonical project atlas MCP unifying Antigravity, Codex, and Claude Code."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "pymupdf>=1.24",
    "pillow>=10.0",
    "typer>=0.12",
    "pytest>=8.0",
]

[project.scripts]
chittam = "chittam.cli:app"
chittam-mcp = "chittam.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chittam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
